[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-amp-modeler"
description = "Neural Amp Modeler"
authors = [
    {name = "Steven Atkinson", email = "steven@atkinson.mn"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "librosa",
    "matplotlib",
    "numpy",
    "pydantic>=2.0.0",
    "pytorch_lightning<=2.6.1",  # Issue 656
    "scipy",  # Required by auraloss
    "sounddevice",
    "tensorboard",
    # PyTorch is selected through the `cpu` or `gpu` extra below.
    # `transformers` is not required, but if you have it, it needs to be recent
    # enough so I'm adding it.
    "transformers>=4",
    "tqdm",
    "wavio>=0.0.5",
]
dynamic = ["version"]

[project.optional-dependencies]
# Select exactly one accelerator variant, e.g. `uv sync --extra cpu`.
cpu = ["torch"]
gpu = ["torch"]

# Optional features
transformers-compat = [
    "transformers>=4",  # Issue-294
    "numpy",  # NB: Older PyTorch versions require numpy<2
]

test = [
    "pytest",
    "pytest-mock",
    "requests",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "h5py",
    "jupyter",
    "pre-commit",
    "pytest",
    "pytest-mock",
    "semver",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    # macOS uses PyPI for its native CPU/MPS wheels.
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
# cu121 has no wheel for Python 3.14.
# cu130 is the compatible PyTorch CUDA index for the configured Python version.
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.urls]
homepage = "https://github.com/sdatkinson/"

[project.scripts]
nam = "nam.cli:nam_gui"
nam-full = "nam.cli:nam_full"
nam-hello-world = "nam.cli:nam_hello_world"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "nam/_version.py"

[tool.setuptools]
include-package-data = true
packages = [
    "nam",
    "nam._dependencies",
    "nam._dependencies.auraloss",
    "nam.train",
    "nam.train._resources",
    "nam.train.gui",
    "nam.train.gui._resources",
    "nam.models",
    "nam.models._resources",
    "nam.models.wavenet",
]

[tool.setuptools.package-data]
"nam.train._resources" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-x"
