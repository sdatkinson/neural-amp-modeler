# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures the full history is available
          fetch-tags: true  # Ensures tags are fetched
      - name: Clone NeuralAmpModelerCore and build loadmodel
        env:
          CXX: clang++
        run: |
          cd "${{ github.workspace }}/.."
          git clone --recurse-submodules --branch v0.4.0.rc2 https://github.com/${{ github.repository_owner }}/NeuralAmpModelerCore.git
          cd NeuralAmpModelerCore/build
          cmake .. -DCMAKE_BUILD_TYPE=Debug
          cmake --build . -j4
      - name: Set up mise toolchain
        uses: jdx/mise-action@v4
        env:
          MISE_PYTHON_VERSION: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync --extra cpu
          uv run --extra cpu nam-hello-world
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names.
          uv run --extra cpu flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uv run --extra cpu flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: |
          xvfb-run -a uv run --extra cpu python -m pytest -v
